inherit_gem:
  sharp_style_rubocop: config/default.yml

Lint/AmbiguousBlockAssociation:
  AllowedPatterns:
    - change

Metrics/AbcSize:
  AllowedMethods:
    - render

Naming/MethodParameterName:
  AllowedNames:
    - 'x'
    - 'y'
    - 'r'

RSpec/ExampleLength:
  Max: 15
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call

RSpec/AnyInstance:
  Exclude:
    - 'spec/mtg_card_maker/svg_gradient_service_spec.rb'

RSpec/VerifiedDoubles:
  Exclude:
    - 'spec/mtg_card_maker/frame_layer_spec.rb'
    - 'spec/mtg_card_maker/name_layer_spec.rb'
    - 'spec/mtg_card_maker/svg_gradient_service_spec.rb'
